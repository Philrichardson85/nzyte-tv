[Unit]
Requires=srv-nzyte\x2dtv-media-catalog.mount
After=srv-nzyte\x2dtv-media-catalog.mount
RequiresMountsFor=/var/lib/nzyte-tv /srv/nzyte-tv/media /srv/nzyte-tv/media/catalog

[Service]
SupplementaryGroups=nzyte-tv-state
# The B1 migration pre-provisions this setgid directory as
# u24:nzyte-tv-state (2750). Clear the base unit's StateDirectory entry so
# systemd does not restore its group to the service's primary u24 group.
StateDirectory=
