[Unit]
Requires=srv-nzyte\x2dtv-media-catalog.mount
After=srv-nzyte\x2dtv-media-catalog.mount
RequiresMountsFor=/var/lib/nzyte-tv /srv/nzyte-tv/media /srv/nzyte-tv/media/catalog /var/lib/nzyte-tv-media-metadata

[Service]
SupplementaryGroups=nzyte-tv-state nzyte-media-metadata
# Preserve the accepted B1 state-directory ownership arrangement.
StateDirectory=
# The broadcaster reads pinned generations but never writes the metadata store.
ReadOnlyPaths=/var/lib/nzyte-tv-media-metadata
